<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ExpenseFlow - Simple</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100">
    <div id="app" class="container mx-auto p-4">
        <h1 class="text-3xl font-bold text-center mb-8">ExpenseFlow</h1>
        
        <!-- Login Form -->
        <div id="loginForm" class="max-w-md mx-auto bg-white p-6 rounded-lg shadow-md">
            <h2 class="text-xl font-semibold mb-4">Iniciar Sesión</h2>
            <input type="email" id="email" placeholder="Email" class="w-full p-2 border rounded mb-3" value="admin@empresa.com">
            <input type="password" id="password" placeholder="Contraseña" class="w-full p-2 border rounded mb-3" value="">
            <button onclick="login()" class="w-full bg-blue-500 text-white p-2 rounded hover:bg-blue-600">Entrar</button>
        </div>

        <!-- Main App -->
        <div id="mainApp" class="hidden">
            <div class="bg-white p-6 rounded-lg shadow-md mb-6">
                <h2 class="text-xl font-semibold mb-4">Agregar Gasto</h2>
                <input type="number" id="amount" placeholder="Cantidad" class="w-full p-2 border rounded mb-3">
                <input type="text" id="description" placeholder="Descripción" class="w-full p-2 border rounded mb-3">
                <select id="category" class="w-full p-2 border rounded mb-3">
                    <option value="comida">Comida</option>
                    <option value="transporte">Transporte</option>
                    <option value="entretenimiento">Entretenimiento</option>
                    <option value="salud">Salud</option>
                    <option value="otros">Otros</option>
                </select>
                <button onclick="addExpense()" class="w-full bg-green-500 text-white p-2 rounded hover:bg-green-600">Agregar Gasto</button>
            </div>

            <div class="bg-white p-6 rounded-lg shadow-md">
                <h2 class="text-xl font-semibold mb-4">Mis Gastos</h2>
                <div id="expensesList"></div>
            </div>

            <button onclick="logout()" class="mt-4 bg-red-500 text-white p-2 rounded hover:bg-red-600">Cerrar Sesión</button>
        </div>

        <div id="message" class="hidden fixed top-4 right-4 p-3 rounded"></div>
    </div>

    <script>
        let authToken = null;
        
        function showMessage(text, isError = false) {
            const msg = document.getElementById('message');
            msg.textContent = text;
            msg.className = `fixed top-4 right-4 p-3 rounded ${isError ? 'bg-red-500 text-white' : 'bg-green-500 text-white'}`;
            msg.classList.remove('hidden');
            setTimeout(() => msg.classList.add('hidden'), 3000);
        }

        async function apiCall(url, options = {}) {
            try {
                console.log('Calling API:', `http://127.0.0.1:8787${url}`);
                const response = await fetch(`http://127.0.0.1:8787${url}`, {
                    method: options.method || 'GET',
                    headers: {
                        'Content-Type': 'application/json',
                        ...options.headers
                    },
                    credentials: 'include',
                    body: options.body
                });
                
                console.log('Response status:', response.status);
                
                if (!response.ok) {
                    const errorText = await response.text();
                    console.error('API Error:', errorText);
                    throw new Error(`HTTP ${response.status}: ${errorText}`);
                }
                
                const text = await response.text();
                console.log('Response text:', text);
                return text ? JSON.parse(text) : {};
            } catch (error) {
                console.error('API Error:', error);
                showMessage(`Error: ${error.message}`, true);
                throw error;
            }
        }

        async function login() {
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            
            console.log('Attempting login with:', { email, password });
            
            try {
                const result = await apiCall('/api/auth/login', {
                    method: 'POST',
                    body: JSON.stringify({ email, password })
                });
                
                console.log('Login result:', result);
                authToken = result.token;
                document.getElementById('loginForm').classList.add('hidden');
                document.getElementById('mainApp').classList.remove('hidden');
                showMessage('Login exitoso');
                loadExpenses();
            } catch (error) {
                console.error('Login failed:', error);
                showMessage(`Error en login: ${error.message}`, true);
            }
        }

        async function addExpense() {
            const amount = document.getElementById('amount').value;
            const description = document.getElementById('description').value;
            const category = document.getElementById('category').value;
            
            if (!amount || !description) {
                showMessage('Completa todos los campos', true);
                return;
            }
            
            try {
                await apiCall('/api/expenses', {
                    method: 'POST',
                    body: JSON.stringify({
                        amount: parseFloat(amount),
                        description,
                        category
                    })
                });
                
                document.getElementById('amount').value = '';
                document.getElementById('description').value = '';
                showMessage('Gasto agregado');
                loadExpenses();
            } catch (error) {
                showMessage('Error al agregar gasto', true);
            }
        }

        async function loadExpenses() {
            try {
                const expenses = await apiCall('/api/expenses');
                const list = document.getElementById('expensesList');
                
                if (expenses.length === 0) {
                    list.innerHTML = '<p class="text-gray-500">No hay gastos registrados</p>';
                    return;
                }
                
                list.innerHTML = expenses.map(expense => `
                    <div class="border-b pb-2 mb-2">
                        <div class="flex justify-between">
                            <span class="font-semibold">$${expense.amount}</span>
                            <span class="text-sm text-gray-600">${expense.category}</span>
                        </div>
                        <p class="text-gray-800">${expense.description}</p>
                        <small class="text-gray-500">${new Date(expense.date).toLocaleDateString()}</small>
                    </div>
                `).join('');
            } catch (error) {
                showMessage('Error al cargar gastos', true);
            }
        }

        function logout() {
            authToken = null;
            document.getElementById('loginForm').classList.remove('hidden');
            document.getElementById('mainApp').classList.add('hidden');
            showMessage('Sesión cerrada');
        }
    </script>
</body>
</html>
