name: Deploy to Production (DEPRECATED - Wrangler removed)

on:
  push:
    branches:
      - 'produccion'

permissions:
  contents: read
  id-token: write

jobs:
  build_and_deploy:
    name: Build and Deploy
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Use Node.js 20.x
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Cache node modules
        uses: actions/cache@v4
        with:
          path: ~/.npm
          key: ${{ runner.os }}-node-${{ hashFiles('**/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-node-

      - name: Install dependencies
        run: npm ci

      - name: Build (tsc + vite)
        run: npm run build

      - name: Deploy to Cloudflare Pages (optional)
        if: ${{ secrets.CF_PAGES_API_TOKEN != '' && secrets.CF_ACCOUNT_ID != '' && secrets.CF_PAGES_PROJECT != '' }}
        uses: cloudflare/pages-action@v1
        with:
          apiToken: ${{ secrets.CF_PAGES_API_TOKEN }}
          accountId: ${{ secrets.CF_ACCOUNT_ID }}
          projectName: ${{ secrets.CF_PAGES_PROJECT }}
          directory: './dist'

      - name: No Pages deploy configured (info)
        if: ${{ secrets.CF_PAGES_API_TOKEN == '' || secrets.CF_ACCOUNT_ID == '' || secrets.CF_PAGES_PROJECT == '' }}
        run: |
          echo "Cloudflare Pages not configured — set CF_PAGES_API_TOKEN, CF_ACCOUNT_ID and CF_PAGES_PROJECT in repository secrets to enable automatic deploys."

      - name: Verification - optional
        run: echo "Build completed. If deploy credentials were provided the static site was sent to Cloudflare Pages. Otherwise no remote deployment was executed."
