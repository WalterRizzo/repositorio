name: Deploy to Production (Wrangler)

on:
  push:
    branches:
      - 'produccion'

permissions:
  contents: read
  id-token: write

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Use Node.js 20.x
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Cache node modules
        uses: actions/cache@v4
        with:
          path: ~/.npm
          key: ${{ runner.os }}-node-${{ hashFiles('**/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-node-

      - name: Install dependencies
        run: npm ci

      - name: Build (tsc + vite)
        run: npm run build

  deploy:
    name: Deploy to Production (Wrangler)
    runs-on: ubuntu-latest
    needs: build
    environment: production

    steps:

      - name: Deploy to Cloudflare Worker using Wrangler (production-only)
        if: ${{ secrets.CF_API_TOKEN != '' && secrets.CF_ACCOUNT_ID != '' }}
        run: |
          echo "Publishing worker with Wrangler (production env)"
          npm run deploy:prod
        env:
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}

      - name: No Wrangler deploy configured (info)
        if: ${{ secrets.CF_API_TOKEN == '' || secrets.CF_ACCOUNT_ID == '' }}
        run: |
          echo "Cloudflare Wrangler deploy not configured — set CF_API_TOKEN and CF_ACCOUNT_ID in repository secrets to enable automatic worker deploys."

      - name: Verification - optional
        run: echo "Build completed. If Wrangler credentials were provided the worker publish was attempted. Otherwise no remote deployment was executed."
