name: Deploy to Production (DEPRECATED - Wrangler removed)

on:
  push:
    branches:
      - 'produccion'

permissions:
  contents: read
  id-token: write

jobs:
  build_and_deploy:
    name: Build and Deploy
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Use Node.js 20.x
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Cache node modules
        uses: actions/cache@v4
        with:
          path: ~/.npm
          key: ${{ runner.os }}-node-${{ hashFiles('**/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-node-

      - name: Install dependencies
        run: npm ci

      - name: Build (tsc + vite)
        run: npm run build

      - name: "NOTE - Wrangler deployment removed"
        run: |
          echo "Wrangler deployment removed from repo. Update this workflow with steps that match your chosen deployment target (S3, Netlify, Vercel, custom worker)."

      - name: Verification - skipped
        run: echo "No remote verification step executed. Add a check for your target host if needed."

      - name: Success
        if: ${{ success() }}
        run: echo "Workflow completed — but no remote deployment was executed (Wrangler removed)."
